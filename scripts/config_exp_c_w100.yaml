seed: 42
seeds: [42, 123, 456]
device: cuda
data:
  swat_dir: ../data/swat
  wadi_dir: ../data/wadi
  smd_dir: ../data/smd/ServerMachineDataset
  window_size: 100
  stride: 1
  val_ratio: 0.2
  datasets:
    - swat
detectors:
  common:
    hidden_dim: 64
    epochs: 50
    batch_size: 256
    lr: 0.001
    patience: 5
  architectures:
    - lstm_ae
    - usad
    - tranad
attacks:
  epsilon_budgets: [0.05]
  methods:
    pgd:
      max_iter: 40
      eps_step_ratio: 0.1
constraints:
  enabled: false
defenses:
  adversarial_training:
    mix_ratio: 0.5
    pgd_steps: 5
    epsilon: 0.05
evaluation:
  threshold_percentile: 99
  metrics:
    - detection_rate
    - false_alarm_rate
    - f1_score
    - attack_success_rate
output:
  results_dir: ../experiments/results_w100
  models_dir: ../experiments/models_w100
  figures_dir: ../figures
